<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Life City</title>
  <meta name="description" content="A town-building game that grows with your family's real goals and habits.">
  <meta name="theme-color" content="#7CC74C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life City">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>
  <canvas id="scene" aria-label="Your town. Drag to move around, pinch or scroll to zoom, tap a building to open it." tabindex="0"></canvas>
  <div class="fail" id="fail">This town needs WebGL. Try opening it in Chrome or Safari.</div>
  <div class="boot" id="boot"><div class="boot-card"><b>Life City</b><span>Getting your town ready…</span></div></div>

  <div class="hud" id="hud" hidden>
    <div class="topbar">
      <button class="avatar-btn" id="profileBtn" type="button" aria-label="Profile"><span id="avatarIn"></span></button>
      <button class="pill level" id="lvlBtn" type="button" aria-label="Level and XP">
        <span class="badge-star" id="lvlStar"><b id="lvl">1</b></span>
        <span class="bar"><i id="xpFill"></i><em id="xpTxt">0 / 60</em></span>
      </button>
      <button class="pill pop" id="popBtn" type="button" aria-label="Population"><span class="ico" id="icoPop"></span><b id="pop">0</b></button>
      <button class="pill coins" id="coinBtn" type="button" aria-label="Coins"><span class="ico" id="icoCoin"></span><b id="coins">0</b></button>
      <button class="sq blue" id="menuBtn" type="button" aria-label="Menu"></button>
    </div>
    <div class="bottombar" id="bottombar">
      <div class="left">
        <button class="big" id="btnBuild" type="button"><span class="art" id="artBuild"></span><span class="lbl">Build</span></button>
        <button class="big" id="btnLists" type="button"><span class="art" id="artLists"></span><span class="lbl">Tasks</span><span class="badge" id="bdgLists" hidden></span></button>
        <button class="big" id="btnMoney" type="button"><span class="art" id="artMoney"></span><span class="lbl">Money</span><span class="badge" id="bdgMoney" hidden></span></button>
        <button class="big" id="btnTrack" type="button"><span class="art" id="artTrack"></span><span class="lbl">Trackers</span><span class="badge" id="bdgTrack" hidden></span></button>
        <button class="big" id="btnCal" type="button"><span class="art" id="artCal"></span><span class="lbl">Calendar</span><span class="badge" id="bdgCal" hidden></span></button>
        <button class="big" id="btnWins" type="button"><span class="art" id="artWins"></span><span class="lbl" id="lblWins">Rewards</span><span class="badge" id="bdgWins" hidden></span></button>
        <button class="big" id="btnMem" type="button" hidden><span class="art" id="artMem"></span><span class="lbl">Memories</span></button>
        <button class="big" id="btnTrophy" type="button" hidden><span class="art" id="artTrophy"></span><span class="lbl">Awards</span><span class="badge" id="bdgTrophy" hidden></span></button>
      </div>
      <button class="go" id="btnToday" type="button"><b id="todayN">0</b><span>Today</span></button>
    </div>
    <div class="modebar" id="modebar" hidden></div>
  </div>

  <div id="tags"></div>
  <div id="fly" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="win" id="win">
      <div class="ribbon"><h2 id="panelTitle"></h2><button type="button" class="close" id="panelClose" aria-label="Close"></button></div>
      <div class="win-tabs" id="panelTabs"></div>
      <div class="win-body" id="panelBody"></div>
    </div>
  </div>
  <div class="tour" id="tour" hidden>
    <div class="tour-arrow" id="tourArrow" hidden></div>
    <div class="tour-card" id="tourCard"></div>
  </div>
  <div class="setup" id="setup" hidden role="dialog" aria-modal="true" aria-labelledby="setupTitle"></div>
  <div class="rotate" id="rotate" hidden role="alertdialog" aria-labelledby="rotateTitle">
    <div class="rot-phone" aria-hidden="true"><i></i></div>
    <b id="rotateTitle">Turn your phone sideways</b>
    <p>Life City plays in landscape, like a real town builder.</p>
    <button type="button" class="btn go-btn" id="rotateFull" hidden>Play full screen</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
